name: Homework bot

on:
  schedule:
    - cron: "3 12 * * *"   # every morning, about 7am Eastern
    - cron: "7 23 * * 0"   # Sunday evening, about 6pm Eastern: the week ahead
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      mode:
        description: "What to send"
        type: choice
        options: [test, daily, weekly]
        default: test

permissions:
  contents: write   # lets the bot save assignments.json for the tracker app

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check Brightspace and notify
        run: python bot.py
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '7 23 * * 0' && 'weekly' || 'daily') }}
          BRIGHTSPACE_URL: ${{ secrets.BRIGHTSPACE_URL }}
          BRIGHTSPACE_USERNAME: ${{ secrets.BRIGHTSPACE_USERNAME }}
          BRIGHTSPACE_PASSWORD: ${{ secrets.BRIGHTSPACE_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save the list for the Homework Tracker app
        run: |
          git config user.name "homework-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assignments.json
          git diff --cached --quiet || (git commit -m "Update assignments" && git push)
      - name: Save screenshots if something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
